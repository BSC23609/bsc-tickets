<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waiting for me — BSC</title>
  <link rel="stylesheet" href="/css/bsc.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0A4566">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <style>body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen bg-white text-ink">
  <header class="bg-white/90 backdrop-blur border-b border-line sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
      <img src="/img/group-logo.png" alt="The Bharat Steel Group" class="h-7 shrink-0" />
      <a href="/home.html" class="text-sm text-slate-500 hover:text-ink">← Home</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between gap-2 mb-4">
      <div>
        <h1 class="font-display font-bold text-xl text-ink">Waiting for me</h1>
        <p class="text-xs text-slate-500 mt-0.5">Everything across the apps that needs your action.</p>
      </div>
      <button onclick="load()" class="btn-ghost text-sm">↻ Refresh</button>
    </div>

    <div id="loading" class="text-center text-slate-400 py-12 text-sm">Loading…</div>
    <div id="empty" class="hidden text-center py-16">
      <div class="text-4xl mb-2">✅</div>
      <div class="font-semibold">You're all caught up</div>
      <div class="text-sm text-slate-500 mt-1">Nothing is waiting for your action right now.</div>
    </div>
    <div id="groups" class="space-y-4"></div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    async function load(){
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('empty').classList.add('hidden');
      document.getElementById('groups').innerHTML='';
      let d; try{ d=await api('/inbox'); }catch(e){ location.href='/'; return; }
      document.getElementById('loading').classList.add('hidden');
      if(!d.total){ document.getElementById('empty').classList.remove('hidden'); return; }
      const ICON={tickets:'🎫',outpass:'🚪',expense:'🧾',ot:'⏰'};
      document.getElementById('groups').innerHTML=d.groups.map(g=>`
        <div class="card p-4">
          <div class="flex items-center justify-between mb-2">
            <div class="font-semibold text-sm">${ICON[g.key]||''} ${g.label}</div>
            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-ink text-white">${g.items.length}</span>
          </div>
          <div class="divide-y divide-line">
            ${g.items.map(it=>`<a href="${it.url}" class="flex items-center justify-between gap-3 py-2.5 hover:bg-slate-50 rounded-lg px-1 -mx-1">
              <div class="min-w-0"><div class="text-sm font-medium truncate">${it.title}</div>
                <div class="text-xs text-slate-500 truncate">${it.subtitle||''}</div></div>
              <span class="text-slate-300 shrink-0">›</span>
            </a>`).join('')}
          </div>
        </div>`).join('');
    }
    load();
  </script>
</body>
</html>
