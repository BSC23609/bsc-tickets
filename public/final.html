<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Approvals — BSC</title>
  <link rel="stylesheet" href="/css/bsc.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0A4566">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css?v=4">
  <style>body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen text-ink">
  <header class="deckbar">
    <div class="max-w-3xl mx-auto px-4 deckbar-in">
      <span class="deck-plate"><img src="/img/group-logo.png" alt="The Bharat Steel Group" /></span>
      <span class="deck-sp"></span>
      <a href="/home.html" class="deck-link">Home</a>
      <button onclick="logout()" class="deck-out">Sign out</button>
    </div>
    <div class="seam"></div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-7">
    <div class="mb-4">
      <div class="eyebrow">Management</div>
      <h1 class="text-2xl font-bold" style="font-family:'Space Grotesk'">Final Approval for Payments</h1>
      <p class="text-sm text-slate-500 mt-1">Everything awaiting your final approval — expenses, staff overtime and labour payments.</p>
    </div>

    <div id="denied" class="hidden card p-8 text-center text-slate-500">This module is for management and admins only.</div>

    <div id="ui" class="hidden">
      <div class="flex items-end gap-2 mb-4 flex-wrap">
        <div><label class="fieldlabel">Month</label><input id="mrMonth" type="month" class="field !w-auto text-sm" onchange="loadMonth()"></div>
        <div class="flex-1 min-w-[120px]"><label class="fieldlabel">Search payee</label>
          <input id="fName" oninput="renderMonth()" placeholder="Name…" class="field text-sm"></div>
        <button onclick="loadMonth()" class="btn-ghost text-sm">↻ Refresh</button>
      </div>

      <div class="card p-4 mb-4 flex items-center justify-between gap-3 flex-wrap" style="background:#0A4566;color:#fff">
        <div>
          <div class="text-sm opacity-80"><span id="statusLine" class="font-bold"></span></div>
          <div class="text-xl font-bold" style="font-family:'Space Grotesk'" id="grand"></div>
        </div>
        <button id="sendBtn" onclick="clickBusy(this,'Sending…',sendConsolidated)"
                class="text-sm font-semibold px-4 py-2.5 rounded-lg bg-white text-brand-700 disabled:opacity-40 disabled:cursor-not-allowed">
          Send consolidated Monthly payment report to Accounts
        </button>
      </div>


      <div id="cats"></div>
      <div id="empty" class="hidden card p-10 text-center text-slate-400"><div class="text-3xl mb-2">🗂️</div>No final-approval items for this month yet.</div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 hidden px-4 py-2 rounded-lg text-white text-sm shadow-lg z-50"></div>

  <script src="/js/common.js?v=89"></script>
  <script>
    const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    async function clickBusy(btn,label,fn){ if(!btn||btn.dataset.busy)return; btn.dataset.busy='1'; const o=btn.innerHTML; btn.disabled=true; btn.innerHTML=(label||'…'); try{ await fn(); }catch(e){ if(window.toast) toast(e.message||'Error','error'); } finally{ delete btn.dataset.busy; btn.disabled=false; btn.innerHTML=o; } }
    const rupee = n => '\u20b9' + Number(n||0).toLocaleString('en-IN');
    let me=null, MONTH=null;
    (async function init(){
      try{ me=await api('/me'); }catch(e){ location.href='/'; return; }
      if(!me.ot_mgmt){ document.getElementById('denied').classList.remove('hidden'); return; }
      document.getElementById('ui').classList.remove('hidden');
      const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
      document.getElementById('mrMonth').value=d.toISOString().slice(0,7);
      await loadMonth();
    })();
    async function logout(){ await api('/logout',{method:'POST'}); location.href='/'; }
    const mrMonth=()=>document.getElementById('mrMonth').value||new Date().toISOString().slice(0,7);

    function typeBadge(k){
      const m={conveyance:['bg-blue-100 text-blue-700','Conveyance'],outstation:['bg-teal-100 text-teal-700','Outstation'],
        misc:['bg-violet-100 text-violet-700','Misc'],ot:['bg-amber-100 text-amber-700','Overtime'],labour:['bg-emerald-100 text-emerald-700','Labours']};
      const x=m[k]||['bg-slate-100 text-slate-600',k]; return '<span class="pill '+x[0]+'">'+x[1]+'</span>';
    }
    async function loadMonth(){
      try{ MONTH=await api('/final/month-items?month='+mrMonth()); renderMonth(); }
      catch(e){ toast(e.message||'Could not load','error'); document.getElementById('statusLine').textContent='Could not load — '+(e.message||''); document.getElementById('grand').textContent=''; document.getElementById('cats').innerHTML=''; document.getElementById('empty').classList.remove('hidden'); }
    }
    function renderMonth(){
      const fn=document.getElementById('fName').value.trim().toLowerCase();
      const cats=(MONTH.categories||[]).map(c=>({...c, items:c.items.filter(i=>!fn||i.payee.toLowerCase().includes(fn))})).filter(c=>c.items.length);
      document.getElementById('grand').textContent=rupee(MONTH.total);
      document.getElementById('statusLine').textContent = MONTH.count===0 ? 'No items this month'
        : (MONTH.pending===0 ? '✓ All '+MONTH.count+' items final-approved' : MONTH.pending+' of '+MONTH.count+' still pending final approval');
      document.getElementById('empty').classList.toggle('hidden', (MONTH.count||0)>0);
      const sb=document.getElementById('sendBtn'); sb.disabled=!MONTH.all_approved;
      sb.title = MONTH.all_approved ? '' : 'Approve every item first';
      const box=document.getElementById('cats'); box.innerHTML='';
      cats.forEach(c=>{
        const pend=c.items.filter(i=>i.state==='pending').length;
        const card=document.createElement('div'); card.className='card p-4 mb-3';
        let html='<div class="flex items-center justify-between gap-2 mb-3 pb-2 border-b border-line">'+
          '<div class="flex items-center gap-2">'+typeBadge(c.key)+'<span class="text-xs text-slate-400">'+c.items.length+' item'+(c.items.length>1?'s':'')+(pend?' · '+pend+' pending':' · all cleared')+'</span></div>'+
          (pend>1?'<button data-cat="'+c.key+'" onclick="approveCategory(this)" class="text-white text-xs font-semibold px-3 py-1.5 rounded-lg" style="background:#0A4566">Approve all pending ('+pend+')</button>':'')+'</div>';
        c.items.forEach(i=>{
          const paidBtn = (i.state==='approved' && i.paidToggle)
            ? (i.paid
                ? '<button onclick=\'togglePaid('+JSON.stringify(i.paidToggle)+',this)\' class="pill bg-slate-200 text-slate-600 text-[11px] hover:bg-slate-300" title="Paid — excluded from report. Click to mark unpaid.">₹ Paid</button>'
                : '<button onclick=\'togglePaid('+JSON.stringify(i.paidToggle)+',this)\' class="pill bg-amber-100 text-amber-700 text-[11px] hover:bg-amber-200" title="Unpaid — will be sent in the report. Click to mark paid.">Unpaid</button>')
            : '';
          const approver = i.approved_by ? '<span class="text-[10px] '+(i.nonmgmt?'text-red-500':'text-slate-400')+' mono" title="'+(i.nonmgmt?'Approved by someone outside management':'')+'">by '+esc(i.approved_by)+(i.nonmgmt?' ⚠':'')+'</span>' : '';
          const reopenBtn = i.reopen ? '<button onclick=\'reopenOne('+JSON.stringify(i.reopen)+',this)\' class="text-[11px] text-slate-400 hover:text-red-600 hover:underline" title="Send back to pending final approval">⟲ Reopen</button>' : '';
          const badge = (i.state==='approved' ? '<span class="pill bg-emerald-100 text-emerald-700 text-[11px]">✓ Final Approved</span>'+approver+paidBtn+reopenBtn
            : (i.state==='offline' ? '<span class="pill bg-slate-200 text-slate-600 text-[11px]">Settled offline</span>' : ''));
          html+='<div class="flex items-center justify-between gap-3 py-2 border-b border-line/50 last:border-0">'+
            '<div class="min-w-0"><div class="text-sm font-semibold text-ink">'+esc(i.payee)+(i.emp_no?' <span class="text-xs text-slate-400 mono">'+esc(i.emp_no)+'</span>':'')+' · '+rupee(i.amount)+'</div>'+
            (i.sub?'<div class="text-xs text-slate-500 mt-0.5">'+esc(i.sub)+'</div>':'')+'</div>'+
            '<div class="flex items-center gap-2 shrink-0">'+
            (i.pdf_token?'<a href="/dlx/'+i.pdf_token+'" target="_blank" class="btn-ghost text-xs">PDF</a>':(i.report_url?'<a href="'+i.report_url+'" target="_blank" class="btn-ghost text-xs">PDF</a>':''))+
            (i.state==='pending'?'<button onclick=\'approveOne('+JSON.stringify(i.approve)+',this)\' class="text-white text-xs font-semibold px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700">Approve</button>':badge)+
            '</div></div>';
        });
        card.innerHTML=html; box.appendChild(card);
      });
    }
    async function approveOne(approve, btn){
      if(btn){ btn.disabled=true; btn.textContent='Approving…'; }
      try{ await api(approve.url,{method:'POST',body:approve.body||{}}); toast('Approved','success'); await loadMonth(); }
      catch(e){ toast(e.message,'error'); if(btn){ btn.disabled=false; btn.textContent='Approve'; } }
    }
    async function approveCategory(btn){
      const cat=btn.getAttribute('data-cat');
      const c=(MONTH.categories||[]).find(x=>x.key===cat); if(!c) return;
      const pend=c.items.filter(i=>i.state==='pending');
      if(!confirm('Approve all '+pend.length+' pending '+c.label+' item(s)?')) return;
      btn.disabled=true; btn.textContent='Approving…';
      let ok=0, fail=0;
      for(const i of pend){ try{ await api(i.approve.url,{method:'POST',body:i.approve.body||{}}); ok++; }catch(e){ fail++; } }
      toast('Approved '+ok+(fail?' · '+fail+' failed':''), fail?'error':'success');
      await loadMonth();
    }
    async function reopenOne(desc, btn){
      if(!confirm('Reopen this claim? It goes back to pending final approval.')) return;
      try{ await api(desc.url,{method:'POST',body:desc.body||{}}); toast('Reopened — back to pending final approval','info'); await loadMonth(); }
      catch(e){ toast(e.message,'error'); }
    }
    async function togglePaid(desc, btn){
      if(btn){ btn.disabled=true; }
      try{ await api(desc.url,{method:'POST',body:desc.body||{}}); await loadMonth(); }
      catch(e){ toast(e.message,'error'); if(btn) btn.disabled=false; }
    }
    async function sendConsolidated(){
      if(!MONTH.all_approved) return toast('Approve every item first','error');
      if(!confirm('Send the consolidated monthly payment report for '+mrMonth()+' to accounts (per company)? Already-sent employees are skipped.')) return;
      const r=await api('/final/monthly-run',{method:'POST',body:{month:mrMonth()}});
      const summ=(r.sent||[]).map(x=>x.company+': '+x.employees+' → '+x.accounts).join(' · ');
      toast(summ?('Sent — '+summ):'Nothing new to send (all already sent)','success');
    }
  </script>
</body>
</html>
